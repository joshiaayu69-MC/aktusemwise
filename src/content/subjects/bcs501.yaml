faqs:
  - question: What is the AKTU end-semester question paper pattern for BCS501?
    answer: >
      The AKTU end-semester examination for BCS501 is worth 70 marks (for the 2022-23 scheme) with
      a duration of 3 hours. Section A consists of 7 short compulsory questions of 2 marks each
      (14 marks) covering all 5 units. Section B contains 5 medium questions of 7 marks each (or
      longer 10-mark problems depending on evaluation scheme revisions), where students attempt 3
      questions. Section C has 5 pairs of unit-wise internal choice questions (7 marks each),
      requiring one answer per unit.
  - question: Which units carry the highest mathematical and numerical weightage in BCS501?
    answer: >
      Unit 3 (Relational Database Design and Normalization) and Unit 4 (Transaction Processing and
      Concurrency Control) carry the highest numerical weight. Expect full 7-to-10 mark questions
      on functional dependency closure, candidate key derivation, 3NF/BCNF decomposition proofs,
      and conflict serializability precedence graph analysis.
  - question: Does BCS501 include an associated practical laboratory exam?
    answer: >
      Yes, BCS551 (Database Management Systems Lab) is scheduled concurrently in semester 5. It
      evaluates practical proficiency in SQL DDL/DML, nested joins, PL/SQL stored procedures,
      triggers, and cursors through weekly practical assessments and an external viva voce.
  - question: Are the question papers and notes here official university publications?
    answer: >
      No. All syllabus facts and question paper links reference the official AKTU portal directly.
      Topic questions, preparation outlines, and solutions are independent educational resources
      created and verified by university subject toppers to assist peer students free of cost.

