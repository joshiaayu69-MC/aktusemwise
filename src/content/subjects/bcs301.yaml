faqs:
  - question: Which programming language should be used for data structures code in AKTU exams?
    answer: >
      AKTU standard evaluation expects algorithms written in structured C syntax or standard
      algorithmic pseudocode. Providing clear comments, struct definitions, pointer manipulations,
      and checking boundary conditions (malloc NULL or underflow) earns full credit.
  - question: What are the most frequently asked 10-mark questions in BCS301?
    answer: >
      Three numerical algorithm tracing questions appear in almost every semester: Infix to
      Postfix conversion with stack trace table (Unit 2), Binary Tree reconstruction from Inorder
      and Preorder traversals (Unit 3), and AVL Tree construction showing rotations (Unit 4).
  - question: Does BCS301 include a laboratory component?
    answer: >
      Yes, BCS351 (Data Structures Lab) runs concurrently in semester 3. Students implement linked
      lists, stacks, queues, binary search trees, and sorting algorithms in C under Linux/GCC.

