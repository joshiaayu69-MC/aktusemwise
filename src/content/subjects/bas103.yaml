faqs:
  - question: Is Engineering Mathematics-I common for all branches in AKTU?
    answer: >
      Yes. BAS103 is a mandatory core course prescribed in Semester 1 for all B.Tech engineering
      branches (CSE, IT, ECE, EE, ME, Civil, AI/ML, and allied specializations). The curriculum,
      question paper pattern, and 70-mark theory evaluation are uniform across all colleges.
  - question: What are the guaranteed passing theorems that recur every year in BAS103?
    answer: >
      Five theorems and problem types recur every semester with near 100% certainty: Cayley-Hamilton
      Theorem (Unit 1), Leibnitz's Theorem nth derivative proof (Unit 2), Lagrange Multipliers or
      Jacobian functional dependence (Unit 3), Change of Order of Integration (Unit 4), and Gauss
      Divergence or Stokes' Theorem verification (Unit 5).
  - question: Can a non-programmable scientific calculator be used in BAS103?
    answer: >
      Yes. AKTU permits standard non-programmable scientific calculators (such as Casio fx-991ES Plus
      or fx-991MS) during Engineering Mathematics examinations for solving systems of linear
      equations, matrix determinants, and standard transcendental functions.

