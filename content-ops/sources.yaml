# Source registry for every resource in the pipeline.
#
# Rules:
# - Add a record BEFORE extracting facts or drafting.
# - `allowed_operations` is the hard boundary. If an operation is not listed, do not do it.
# - `rehost_pdf: false` means link to the source, do not copy the file into R2 or Git.
# - `risk: high` or `licence: blocked` means stop and ask the editor.
# - Verify each record at the time of use. Licences and URLs change.
#
# Validate with: npx tsx scripts/source-audit.ts

- id: aktu-syllabus
  title: AKTU official syllabus portal
  url: https://aktu.ac.in/syllabus.html
  publisher: Dr. A.P.J. Abdul Kalam Technical University, Lucknow
  accessed_at: 2026-11-16
  licence: official-facts-only
  allowed_operations:
    - facts-only
    - link-only
    - quote-limited
  commercial_use_ok: true
  attribution_required: true
  share_alike: false
  rehost_pdf: false
  risk: medium
  notes: >
    Use for subject codes, names, units, topics, credits, and scheme facts. Do not copy
    syllabus prose. Link the official PDF. Confirm the current scheme before publishing.

